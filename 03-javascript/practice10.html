<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="practice10.css" />
  </head>
  <body>
    <div class="box">
      <h1>회원가입</h1>
      <input type="text" id="id" placeholder="아이디를 입력해주세요" />
      <p id="idCheck">영문자로 시작하고 영문자와 숫자 조합으로 4~12자 이내</p>

      <input type="text" id="pwd" placeholder="비밀번호를 입력해주세요" />
      <p id="pwdCheck">영문자, 숫자, 특수문자 조합으로 8~15자 이내</p>

      <input
        type="text"
        id="pwdDouble"
        placeholder="비밀번호를 다시 한 번 입력해주세요"
      />
      <p id="pwdDoubleCheck">위 비밀번호와 동일하게</p>

      <input type="text" id="uName" placeholder="이름을 입력해주세요" />
      <p id="uNameCheck">한글 2자 이상</p>

      <input type="text" id="email" placeholder="이메일을 입력해주세요" />
      <p id="emailCheck">이메일 형식</p>

      <input type="text" id="phone" placeholder="전화번호를 입력해주세요" />
      <p id="phoneCheck">010-0000-0000 형식</p>

      <button id="bt01">회원가입</button>
      <button id="bt02">취소</button>
    </div>

    <script src="practice10.js"></script>
  </body>
</html>
